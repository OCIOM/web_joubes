# Administration du site Joubes (Sveltia CMS)
# À MODIFIER une seule fois : remplacez VOTRE-COMPTE-GITHUB par votre nom d'utilisateur GitHub.
backend:
  name: github
  repo: OCIOM/web_joubes
  branch: main

app_title: Joubes — administration
logo:
  src: /favicon.svg
site_url: https://joubes.fr

# Les photos envoyées sont rangées ici, puis automatiquement converties en WebP et redimensionnées.
media_folder: projet/static/images/fauteuils
public_folder: /images/fauteuils
media_libraries:
  default:
    config:
      max_file_size: 20971520
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
          height: 1600

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: fauteuils
    label: Fauteuils
    label_singular: Fauteuil
    description: "Ajoutez, modifiez ou retirez les fauteuils de la collection. Chaque enregistrement met le site à jour en une à deux minutes."
    folder: projet/contenu/fauteuils
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: nom
    slug: "{{nom}}"
    summary: "{{nom}} · {{disponibilite}}"
    sortable_fields: [ordre, nom]
    fields:
      - { label: "Nom du fauteuil", name: nom, widget: string, hint: "Ex. : Aube. Le nom sert aussi à l'adresse de la page (ne le changez plus une fois en ligne)." }
      - { label: "Afficher sur le site", name: en_ligne, widget: boolean, default: true, hint: "Décochez pour masquer le fauteuil sans le supprimer." }
      - { label: "Ordre d'affichage", name: ordre, widget: number, value_type: int, default: 10, min: 1, hint: "1 = en premier. Les 4 premiers fauteuils de la collection apparaissent aussi sur l'accueil, le premier en grande image." }
      - { label: "Disponibilité", name: disponibilite, widget: select, options: ["Disponible", "Réservé", "Vendu"], default: "Disponible" }
      - { label: "Photo principale", name: photo, widget: image, hint: "Photo carrée de préférence, bien éclairée." }
      - { label: "Description de la photo", name: description_photo, widget: string, hint: "Décrivez ce qu'on voit, ex. : Fauteuil Aube en velours vert, vue de face. Utile aux malvoyants et à Google." }
      - label: "Autres photos"
        name: photos
        widget: list
        required: false
        label_singular: photo
        fields:
          - { label: "Photo", name: image, widget: image }
          - { label: "Description de la photo", name: description, widget: string, required: false }
      - { label: "Style", name: style, widget: string, required: false, hint: "Ex. : Louis XV, bergère, cabriolet…" }
      - { label: "Époque", name: epoque, widget: string, required: false, hint: "Ex. : fin XIXe siècle" }
      - { label: "Description", name: description, widget: text, required: false, hint: "L'histoire du fauteuil et le relooking réalisé. Laissez une ligne vide entre deux paragraphes." }
      - { label: "Dimensions", name: dimensions, widget: string, required: false, hint: "Ex. : L 70 × P 65 × H 90 cm" }
      - { label: "Hauteur d'assise", name: hauteur_assise, widget: string, required: false }
      - { label: "Structure", name: structure, widget: string, required: false }
      - { label: "Tissu", name: tissu, widget: string, required: false }
      - { label: "Travaux réalisés", name: travaux, widget: string, required: false }

  - name: reglages
    label: Réglages du site
    files:
      - name: coordonnees
        label: Coordonnées et réglages
        file: projet/contenu/reglages.json
        format: json
        fields:
          - { label: "Téléphone (affiché)", name: telephone, widget: string, hint: "Ex. : 06 12 34 56 78" }
          - { label: "Téléphone (format international)", name: telephone_international, widget: string, hint: "Ex. : +33612345678, sans espace. Sert au bouton Appeler." }
          - { label: "E-mail", name: email, widget: string }
          - { label: "Clé Web3Forms", name: cle_web3forms, widget: string, hint: "La clé reçue sur web3forms.com pour recevoir les messages du formulaire." }
          - { label: "Adresse du site", name: domaine, widget: string, hint: "Ex. : https://joubes.fr" }